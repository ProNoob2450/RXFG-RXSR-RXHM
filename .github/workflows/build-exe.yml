name: Build RXN Dashboard Executable

on:
  push:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Compile Application with MSVC
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cl.exe /EHsc /O2 /std:c++17 /Fe:rxn-labs.exe ^
        src/main/main.cpp ^
        src/main/rxn_config.cpp ^
        src/telemetry/rxn_hardware_monitor.cpp ^
        src/telemetry/rxn_game_optimizer.cpp ^
        src/ui/rxn_ui_manager.cpp ^
        src/ui/rxn_ui_renderer_dwm.cpp ^
        src/ui/rxn_ui_renderer_dcomp.cpp ^
        src/graphics/rxn_graphics_engine.cpp ^
        src/graphics/rxn_super_resolution.cpp ^
        src/graphics/rxn_frame_generation.cpp ^
        src/graphics/rxn_capture_pipeline.cpp ^
        /link gdi32.lib dwmapi.lib d3d11.lib dcomp.lib user32.lib ole32.lib dxgi.lib windowsapp.lib

    - name: Upload Release Executable
      uses: actions/upload-artifact@v4
      with:
        name: rxn-dashboard-release
        path: rxn-labs.exe
